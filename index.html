<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="藍の単語帳"><meta name="theme-color" content="#1B3A66"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./apple-touch-icon.png"><link rel="icon" href="./icon-192.png"><title>藍の単語帳</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&family=Noto+Sans+SC:wght@400;500&display=swap">
<style>
:root{
  --bg:#EEF0F3; --surface:#FBFBFC; --surface2:#E4E8ED; --raised:#FFFFFF;
  --ink:#161C24; --ink2:#4A5563; --ink3:#7C8794;
  --rule:#CFD6DE; --rule2:#DFE4EA;
  --accent:#23477A; --accent2:#35618F; --onAccent:#F7F9FC;
  --ok:#3F7A57; --warn:#A8762A; --bad:#A8433C;
  --shadow:0 1px 2px rgba(22,28,36,.07), 0 8px 24px -12px rgba(22,28,36,.18);
  --jp:"Klee One","Zen Kaku Gothic New","Hiragino Mincho ProN","Yu Gothic",serif;
  --ui:"Zen Kaku Gothic New","Noto Sans SC","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#11151B; --surface:#182029; --surface2:#202A35; --raised:#1D2732;
    --ink:#E7ECF2; --ink2:#A9B4C0; --ink3:#76828F;
    --rule:#2C3846; --rule2:#232E3A;
    --accent:#7FA8DC; --accent2:#A6C4EC; --onAccent:#0E141B;
    --ok:#7FBF97; --warn:#DDAE60; --bad:#E28C84;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
  }
}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#182029; --surface2:#202A35; --raised:#1D2732;
  --ink:#E7ECF2; --ink2:#A9B4C0; --ink3:#76828F;
  --rule:#2C3846; --rule2:#232E3A;
  --accent:#7FA8DC; --accent2:#A6C4EC; --onAccent:#0E141B;
  --ok:#7FBF97; --warn:#DDAE60; --bad:#E28C84;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);
  font-size:16px;line-height:1.7;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
.zh{font-family:"Noto Sans SC",var(--ui)}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:76px 1fr;min-height:100vh}
#rail{border-right:1px solid var(--rule);background:var(--surface);
  display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 0;position:sticky;top:0;height:100vh}
.brand{font-family:var(--jp);font-weight:600;font-size:15px;writing-mode:vertical-rl;
  letter-spacing:.28em;color:var(--accent);margin-bottom:14px;user-select:none}
.tab{writing-mode:vertical-rl;font-family:var(--jp);font-size:16px;letter-spacing:.22em;
  padding:16px 9px;border-radius:999px;color:var(--ink3);transition:color .15s,background .15s}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--accent);background:var(--surface2);font-weight:600}
.tab small{writing-mode:horizontal-tb;display:block;font-family:var(--mono);font-size:9px;
  letter-spacing:0;opacity:.65;margin-top:8px;text-align:center}
#rail .spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;
  color:var(--ink3);font-size:17px}
.icon-btn:hover{color:var(--ink);background:var(--surface2)}

main{min-width:0;padding:0 0 64px}
.bar{position:sticky;top:0;z-index:5;background:var(--bg);background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(10px);border-bottom:1px solid var(--rule2);padding:14px 26px 12px}
.bar-row{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;max-width:920px;margin:0 auto}
h1{font-family:var(--jp);font-weight:600;font-size:21px;margin:0;letter-spacing:.04em}
.sub{font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.wrap{max-width:920px;margin:0 auto;padding:26px}

/* ---------- controls ---------- */
.filt{margin-left:10px;display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--ink2);background:var(--surface);border:1px solid var(--rule);
  border-radius:999px;padding:4px 12px;transition:.15s;white-space:nowrap}
.filt:hover{border-color:var(--accent);color:var(--accent)}
.filt.on{border-color:var(--accent);color:var(--accent);font-weight:500}
.filt b{font-size:10px;font-weight:400;color:var(--ink3)}
.filt.on b{color:var(--accent)}
#barPanel[hidden]{display:none}
#barQuick{margin-left:auto;display:flex;gap:8px;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{font-size:12.5px;padding:5px 12px;border:1px solid var(--rule);border-radius:999px;
  color:var(--ink2);background:var(--surface);transition:.15s}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--onAccent);font-weight:500}
.seg{display:inline-flex;border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{padding:5px 12px;font-size:12.5px;color:var(--ink2);border-right:1px solid var(--rule)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--surface2);color:var(--accent);font-weight:600}
.field{width:100%;padding:11px 14px;border:1px solid var(--rule);border-radius:10px;
  background:var(--surface);color:var(--ink);font-family:var(--ui);font-size:15px}
.field::placeholder{color:var(--ink3)}
.note{font-size:12.5px;color:var(--ink3);line-height:1.6}

/* ---------- flashcard ---------- */
.card{background:var(--raised);border:1px solid var(--rule);border-radius:16px;
  box-shadow:var(--shadow);padding:34px 30px;position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);opacity:.5}
.tag{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);display:flex;gap:10px;align-items:center}
.box-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);display:inline-block}
.q{font-family:var(--jp);font-weight:600;line-height:1.35;margin:18px 0 0;
  font-size:clamp(2rem,7.5vw,3.1rem);letter-spacing:.02em;text-wrap:balance}
.q.small{font-size:clamp(1.35rem,4.6vw,2rem)}
.reading{font-family:var(--jp);font-size:19px;color:var(--accent2);letter-spacing:.08em;margin-top:6px}
.mean{font-family:"Noto Sans SC",var(--ui);font-size:19px;font-weight:500;margin-top:14px}
.ex{border-top:1px dashed var(--rule);margin-top:20px;padding-top:18px}
.ex-jp{font-family:var(--jp);font-size:20px;line-height:1.75}
.ex-zh{font-family:"Noto Sans SC",var(--ui);font-size:14.5px;color:var(--ink2);margin-top:5px}
.hint{margin-top:22px;font-size:12.5px;color:var(--ink3);font-family:var(--mono)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:20px}
.grade button{padding:14px 6px;border-radius:11px;border:1px solid var(--rule);
  background:var(--surface);font-weight:500;font-size:14.5px;transition:.15s}
.grade button:hover{transform:translateY(-1px)}
.grade button b{display:block;font-family:var(--mono);font-size:10px;font-weight:400;
  color:var(--ink3);letter-spacing:.08em;margin-top:2px}
.g1{color:var(--bad)} .g1:hover{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,var(--surface))}
.g2{color:var(--warn)} .g2:hover{border-color:var(--warn);background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.g3{color:var(--ok)} .g3:hover{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
kbd{display:inline-block;font-family:var(--mono);font-size:10px;line-height:1.4;
  min-width:1.35em;text-align:center;padding:1px 4px;margin:0 1px;
  color:var(--ink2);background:var(--surface2);
  border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px}
.grade button:hover kbd{border-color:currentColor;color:currentColor}
.hint kbd{margin:0 2px}

.reveal{animation:rise .16s ease-out}
@keyframes rise{from{opacity:0;transform:translateY(3px)}to{opacity:1;transform:none}}
.speak{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;
  color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:4px 11px;letter-spacing:.06em}
.speak:hover{background:var(--surface2)}

.foot{display:flex;align-items:center;gap:12px;margin-top:8px;flex-wrap:wrap}
.foot .note{margin-left:auto}
.nav{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink2);
  border:1px solid var(--rule);border-radius:999px;padding:5px 13px;transition:.15s}
.nav b{font-family:var(--mono);font-size:9.5px;font-weight:400;color:var(--ink3);letter-spacing:.08em}
.nav:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
.nav[disabled]{opacity:.3;cursor:default}
.nav.tog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent)}
.nav.tog[aria-pressed="true"] b{color:var(--accent);font-weight:600}
.done-mark{font-family:var(--mono);font-size:10px;color:var(--warn);
  border:1px solid var(--warn);border-radius:3px;padding:0 5px;margin-left:6px}
.empty-btns{margin-top:22px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}

/* ---------- lists ---------- */
.row.num{grid-template-columns:auto 1fr auto}
.no{font-family:var(--mono);font-size:11px;color:var(--ink3);min-width:3.1em;
  text-align:right;padding:4px 10px 0 0;line-height:1.4;border:0;background:none;
  align-self:start;transition:.15s}
.no:hover{color:var(--accent)}
.no.on{color:var(--onAccent);background:var(--accent);border-radius:5px;
  padding:2px 6px;margin-right:10px;min-width:0;font-weight:600;align-self:start}
.chips.scene{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--rule2)}
.resume{display:flex;align-items:center;gap:10px;margin-bottom:16px;padding:10px 14px;
  border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;
  background:var(--surface);font-size:13px;color:var(--ink2)}
.resume b{font-family:var(--mono);color:var(--accent)}
.rows{display:flex;flex-direction:column;gap:0;margin-top:6px}
.row{border-bottom:1px solid var(--rule2);padding:16px 2px;display:grid;
  grid-template-columns:1fr auto;gap:12px;align-items:start}
.row:last-child{border-bottom:0}
.row-main{min-width:0}
.row-jp{font-family:var(--jp);font-size:19px;line-height:1.6}
.row-jp em{font-style:normal;color:var(--accent2);font-weight:600}
.row-zh{font-family:"Noto Sans SC",var(--ui);font-size:14px;color:var(--ink2);margin-top:3px}
.row-meta{font-family:var(--mono);font-size:11px;color:var(--ink3);margin-top:6px;letter-spacing:.04em}
.group-head{font-family:var(--jp);font-size:14px;letter-spacing:.16em;color:var(--accent);
  margin:34px 0 4px;padding-bottom:7px;border-bottom:1px solid var(--rule);font-weight:600}
.group-head:first-child{margin-top:8px}
.group-head span{font-family:var(--mono);font-size:10.5px;color:var(--ink3);letter-spacing:.06em;float:right;font-weight:400}

/* ---------- quiz ---------- */
.opts{display:flex;flex-direction:column;gap:9px;margin-top:22px}
.opt{text-align:left;padding:14px 16px;border:1px solid var(--rule);border-radius:11px;
  background:var(--surface);font-size:16px;transition:.14s}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));color:var(--ok);font-weight:600}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface));color:var(--bad)}
.opt .jp{font-family:var(--jp)}

/* ---------- stats ---------- */
.countdown{font-family:var(--mono);font-size:11.5px;color:var(--warn);
  border:1px solid var(--warn);border-radius:999px;padding:2px 10px;white-space:nowrap}
.streak{font-family:var(--mono);font-size:11.5px;color:var(--accent);
  border:1px solid var(--accent);border-radius:999px;padding:2px 10px;white-space:nowrap;font-weight:600}
.today-card{background:var(--raised);border:1px solid var(--rule);border-left:3px solid var(--accent);
  border-radius:14px;padding:22px 24px;box-shadow:var(--shadow);margin-bottom:8px}
.today-card.done{border-left-color:var(--ok);background:color-mix(in srgb,var(--ok) 6%,var(--raised))}
.today-l{font-size:12.5px;color:var(--ink3);letter-spacing:.08em}
.today-n{font-family:var(--mono);font-size:44px;font-weight:600;line-height:1.1;
  letter-spacing:-.02em;font-variant-numeric:tabular-nums;margin-top:2px}
.today-n span{font-size:17px;font-weight:400;color:var(--ink3)}
.today-msg{font-size:13px;color:var(--ink2);margin-top:10px}
.cal{display:flex;flex-wrap:wrap;gap:4px;margin:10px 0 4px}
.cell{width:24px;height:24px;display:grid;place-items:center;border-radius:5px;
  font-size:12px;border:1px solid var(--rule2)}
.cell.d1{color:var(--ink3)}
.cell.d2{color:var(--accent);border-color:var(--accent)}
.cell.d3{color:var(--onAccent);background:var(--accent);border-color:var(--accent)}
.badge-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:9px;margin-top:10px}
.badge-card{border:1px solid var(--rule);border-radius:10px;padding:11px 13px;background:var(--surface);opacity:.5}
.badge-card.got{opacity:1;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.badge-n{font-family:var(--jp);font-weight:700;font-size:14px}
.badge-card.got .badge-n{color:var(--accent)}
.badge-d{font-size:11.5px;color:var(--ink3);margin-top:3px;line-height:1.5}
.badge-s{font-family:var(--mono);font-size:9.5px;color:var(--ink3);margin-top:6px;letter-spacing:.06em}
.badge-card.got .badge-s{color:var(--accent)}
.cheer{text-align:center;padding:56px 20px}
.cheer-big{font-family:var(--jp);font-size:30px;font-weight:700;color:var(--accent);
  animation:pop .3s ease-out}
.cheer-sub{font-family:var(--mono);font-size:15px;color:var(--ink2);margin-top:10px}
.badge-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:20px}
.badge{font-family:var(--jp);font-size:12px;border:1px solid var(--rule);border-radius:999px;padding:4px 12px;color:var(--ink3)}
.badge.got{color:var(--onAccent);background:var(--accent);border-color:var(--accent);font-weight:700}
.badge.big{font-size:14px;padding:7px 18px}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:2px 28px;margin:8px 0 30px}
.stat{padding:14px 0;border-bottom:1px solid var(--rule2)}
.stat-n{font-family:var(--mono);font-size:30px;font-weight:600;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums;line-height:1.1}
.stat-l{font-size:12.5px;color:var(--ink3);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  color:var(--ink3);font-weight:400;padding:0 0 8px;border-bottom:1px solid var(--rule)}
td{padding:11px 0;border-bottom:1px solid var(--rule2)}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--ink2)}
.tbl-wrap{overflow-x:auto}
.danger{color:var(--bad)}

.empty{text-align:center;padding:70px 20px;color:var(--ink3)}
.empty .big{font-family:var(--jp);font-size:26px;color:var(--ink2);margin-bottom:10px}
.progress-line{height:2px;background:var(--rule2);margin-top:11px;border-radius:2px;overflow:hidden}
.progress-line i{display:block;height:100%;background:var(--accent);transition:width .3s}


/* ---------- furigana ---------- */
ruby{ruby-position:over;-webkit-ruby-position:before}
rt{font-family:var(--jp);font-size:.5em;font-weight:400;color:var(--ink3);
  letter-spacing:0;line-height:1.15;text-align:center}
[data-furi="on"] .ex-jp,[data-furi="on"] .row-jp{line-height:2.15}
[data-furi="on"] .q{line-height:1.75}
[data-furi="on"] .opt .jp{line-height:2}

/* ---------- level pill ---------- */
.lv{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.06em;
  padding:1px 5px 1px 4px;border-left:2px solid;border-radius:2px;
  background:var(--surface2);white-space:nowrap}
.lv3{color:var(--ok);border-color:var(--ok)}
.lv2{color:var(--accent);border-color:var(--accent)}
.lv1{color:var(--bad);border-color:var(--bad)}
.row-side{display:flex;flex-direction:column;gap:6px;align-items:flex-end}

@media (max-width:720px){
  #app{grid-template-columns:1fr}
  #rail{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;
    border-right:0;border-top:1px solid var(--rule);padding:6px 4px;gap:0;justify-content:space-around;z-index:20}
  .brand{display:none} #rail .spacer{display:none}
  .tab{writing-mode:horizontal-tb;letter-spacing:.02em;font-size:13px;padding:7px 10px;flex:1;text-align:center}
  .tab small{display:none}
  .icon-btn{width:34px;height:34px;font-size:15px}
  main{padding-bottom:74px}
  .wrap{padding:18px 16px}
  .bar{padding:12px 16px 10px}
  .card{padding:26px 20px;border-radius:14px}
  .grade button{padding:13px 4px;font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body><div id="app">
  <nav id="rail" role="tablist" aria-label="学習モード">
    <div class="brand">藍の単語帳</div>
    <button class="tab" role="tab" data-view="cards">単語<small>SRS</small></button>
    <button class="tab" role="tab" data-view="grammar">文法<small>N2</small></button>
    <button class="tab" role="tab" data-view="speak">会話<small>音読</small></button>
    <button class="tab" role="tab" data-view="quiz">小試験<small>4択</small></button>
    <button class="tab" role="tab" data-view="stats">記録<small>LOG</small></button>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="配色を切り替える" aria-label="配色を切り替える">◐</button>
  </nav>
  <main>
    <div class="bar">
      <div class="bar-row">
        <h1 id="vTitle">単語</h1>
        <span class="sub" id="vSub"></span>
        <span id="barQuick"></span>
        <button class="filt" id="barToggle" aria-expanded="false">絞り込み<b>▾</b></button>
      </div>
      <div id="barPanel" hidden>
        <div class="bar-row" style="margin-top:9px" id="barTools"></div>
        <div class="bar-row" style="margin-top:7px" id="barTools2"></div>
      </div>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>
<script>
const VOCAB=[],GRAM=[],SPK=[];
let _c="",_L="",_i=0,F=[];
const P=s=>s.replace(/[（(][^）)]*[）)]/g,"");
const LV={
d1:"2112221232"+"1222212323"+"2111232113"+"3332112121"+"2221222233"+"2222212233"+"1222312221"+"3322222123"+"2211213321"+"1321333221122",
d2:"2122211121"+"1123221321"+"1221122131"+"1122111122"+"2212111122"+"2131222131"+"2233233122"+"1222122212"+"1221211211"+"21212222212",

function deepMerge(a,b){ const o = Array.isArray(a)?b:Object.assign({},a);
  if(!Array.isArray(a)) for(const k in b){ o[k] = (b[k] && typeof b[k]==="object" && !Array.isArray(b[k])) ? deepMerge(a[k]||{}, b[k]) : b[k]; }
  return o; }

function grade(it, g){
  const k = key(it); const r = st.srs[k] || [0,0];
  let b = r[0];
  if(g===3) b = Math.min(BOXES.length-1, b+1);
  else if(g===2) b = Math.max(1, b);
  else b = 0;
  st.srs[k] = [b, today() + (g===1 ? 0 : g===2 ? 1 : BOXES[b])];
  const d = dstr(); st.log[d] = (st.log[d]||0) + 1;
  st.best = Math.max(st.best||0, st.log[d]);
  save();
}

function buildQueue(){

function go(d){                       // 採点せずに移動するだけ

function doGrade(g){
  if(!cur) return;

  if(m){                              // このセッションで採点済み → 前回分を取り消す
    if(m.rec) st.srs[k] = m.rec.slice(); else delete st.srs[k];
    if(st.log[m.day]){ st.log[m.day]--; if(!st.log[m.day]) delete st.log[m.day]; }
    if(m.g===1){ const j = deck.indexOf(cur, idx+1); if(j>=0) deck.splice(j,1); }
  } else {
    m = { rec: st.srs[k] ? st.srs[k].slice() : null };
    marks.set(cur, m);

  const e0 = earnedIds();
  grade(cur, g);
  m.g = g; m.day = dstr();

  if(!st.clear[d0] && (st.log[d0]||0) >= st.cfg.goal){

                    got: BADGES.filter(b=>earnedIds().includes(b.id) && !e0.includes(b.id)) };

  idx++; shown=false; syncCur(); vCards(); }

/* ---- 小試験 ---- */
function mkQ(){
  const p = pool(); if(p.length<4) return null;
  const kind = Math.random();
  if(kind < .38){ const a = p[Math.floor(Math.random()*p.length)];
    const d = shuffle(p.filter(x=>x!==a && x.cat===a.cat)).slice(0,3);
    return { q:a.c, qz:true, tip:"中国語 → 日本語", it:a,
      opts: shuffle([a,...d]).map(x=>({t:x.w+"　"+x.r, jp:true, ok:x===a})) }; }
  if(kind < .72){ const a = p[Math.floor(Math.random()*p.length)];
    const d = shuffle(p.filter(x=>x!==a && x.cat===a.cat)).slice(0,3);
    return { q:a.w, tip:"日本語 → 中国語", it:a,
      opts: shuffle([a,...d]).map(x=>({t:x.c, ok:x===a})) }; }
  const gp = GRAM.filter(lvOK);
  if(gp.length < 4){ const v = p[Math.floor(Math.random()*p.length)];
    const vd = shuffle(p.filter(x=>x!==v)).slice(0,3);
    return { q:v.w, tip:"日本語 → 中国語", it:v, opts: shuffle([v,...vd]).map(x=>({t:x.c, ok:x===v})) }; }
  const a = gp[Math.floor(Math.random()*gp.length)];
  const d = shuffle(gp.filter(x=>x!==a)).slice(0,3);
  const segs = a.p.replace(/[（(][^）)]*[）)]/g,"").split(/[〜～／]/).filter(s=>s.length>1)
    .sort((x,y)=>y.length-x.length);
  const core = segs.find(s=>a.ex.includes(s)) || "";
  return { q: core ? a.ex.replace(core,"＿＿＿") : a.ex, zhq:a.exc,
    tip: core ? "空欄に入る句型" : "この例文に合う句型", it:{...a,_t:"G"},
    opts: shuffle([a,...d]).map(x=>({t:x.p+"　"+x.c, jp:true, ok:x===a})) };
}
const curQ = ()=> qs[qi] || null;
function qGo(d){
  if(d < 0){ if(qi>0){ qi--; vQuiz(); } return; }
  if(qi < qs.length-1){ qi++; }
  else { const nq = mkQ(); if(!nq) return; qs.push(nq); qi = qs.length-1;
         if(qs.length > 60){ qs.shift(); qi--; } }
  vQuiz(); }
function vQuiz(){
  head("小試験", quizN? ("正解 "+quizOK+" / "+quizN+"　"+Math.round(quizOK/quizN*100)+"%") : "4択 · 単語と文法",
    deckChips(), lvChips());
  if(!qs.length){ const nq = mkQ(); if(nq){ qs.push(nq); qi = 0; } }
  const q = curQ();
  if(!q){ $("#view").innerHTML='<div class="empty">出題できる項目が足りません。デッキとレベルを選び直してください。</div>'; return; }
  const it = q.it;
  $("#view").innerHTML =
    '<div class="card"><div class="tag">'+pill(it)+' '+esc(q.tip)+
      '<span style="margin-left:auto">Q'+(qi+1)+' / '+qs.length+'</span></div>' +
    '<div class="q'+(q.q.length>9?" small":"")+'" '+(q.qz?'style="font-family:var(--ui)"':"")+'>'+esc(q.q)+'</div>' +
    (q.zhq?'<div class="ex-zh" style="margin-top:8px">'+esc(q.zhq)+'</div>':"") + '</div>' +
    '<div class="opts">'+q.opts.map((o,i)=>{
      let cls = "opt";
      if(q._done){ if(o.ok) cls += " right"; else if(i===q.picked) cls += " wrong"; }
      return '<button class="'+cls+'" data-o="'+i+'"'+(q._done?" disabled":"")+'><span'+(o.jp?' class="jp"':' class="zh"')+'>'+esc(o.t)+'</span></button>';
    }).join("")+'</div>' +
    (q._done && it.f ? '<div class="card" style="margin-top:14px;padding:18px 20px">' +
       '<div class="ex-jp">'+ruby(it.f)+'</div><div class="ex-zh">'+esc(it.exc||it.zh||"")+'</div></div>' : "") +
    '<div class="foot"><button class="nav" id="qPrev"'+(qi>0?"":" disabled")+
      ' title="採点済みの問題を見返す">← 前へ<b><kbd>←</kbd></b></button>' +
    '<button class="nav" id="qNext">次へ →<b><kbd>→</kbd></b></button>' +
    '<button class="nav tog" id="autoNext" aria-pressed="'+(!!st.cfg.autoNext)+
      '" title="正解したとき、自動で次の問題へ進むかどうか">自動で次へ<b>'+(st.cfg.autoNext?"ON":"OFF")+'</b></button>' +
    '<span class="note">'+(q._done?"回答済み":"未回答")+'</span></div>';
  if(!q._done) document.querySelectorAll("[data-o]").forEach((b,i)=>b.onclick=()=>answer(i));
  $("#qPrev").onclick = ()=>qGo(-1);
  $("#qNext").onclick = ()=>qGo(1);
  $("#autoNext").onclick = ()=>{ st.cfg.autoNext = !st.cfg.autoNext; save(); vQuiz(); };
}
function answer(i){
  const q = curQ(); if(!q || q._done) return;
  q._done = true; q.picked = i;
  const ok = q.opts[i].ok; quizN++; if(ok) quizOK++;
  st.quiz.n++; if(ok) st.quiz.ok++;
  grade(q.it, ok?3:1); save();
  vQuiz();
  if(q.it.ex) say(strip(q.it.ex));
  // 既定は止まる。トグル ON のときだけ正解で自動送り（不正解は常に止まる）
  if(ok && st.cfg.autoNext) setTimeout(()=>{ if(curQ()===q && st.cfg.view==="quiz") qGo(1); }, 900);
}

  const cats = VCATS.map(c=>{ const a=VOCAB.filter(v=>v.cat===c);
    const m=a.filter(v=>st.srs["V:"+v.w]&&st.srs["V:"+v.w][0]>=MASTER).length;
    return '<tr><td>'+esc(c)+'</td><td class="n">'+a.length+'</td><td class="n">'+m+'</td><td class="n">'+Math.round(m/a.length*100)+'%</td></tr>'; }).join("");
  const g = st.cfg.goal, todayN = st.log[t]||0, cleared = !!st.clear[t], dl = daysLeft();
  let cal="";
  for(let i=29;i>=0;i--){ const d=dstrOf(i), n=st.log[d]||0;
    const cls = st.clear[d] ? "d3" : n>0 ? "d2" : "d1";
    const mk  = st.clear[d] ? "◎" : n>0 ? "○" : "・";
    cal += '<span class="cell '+cls+'" title="'+d+'　'+n+' 枚">'+mk+'</span>'; }
  const eids = earnedIds();
  const badges = BADGES.map(b=>{ const got = eids.includes(b.id);
    return '<div class="badge-card'+(got?" got":"")+'"><div class="badge-n">'+esc(b.n)+'</div>' +
      '<div class="badge-d">'+esc(b.d)+'</div>' +
      '<div class="badge-s">'+(got?"獲得 "+st.badges[b.id]:"未獲得")+'</div></div>'; }).join("");
  $("#view").innerHTML =
   '<div class="today-card'+(cleared?" done":"")+'">' +
     '<div class="today-l">今日のノルマ'+(dl!==null&&dl>0?'　／　試験まで あと '+dl+' 日':'')+'</div>' +
     '<div class="today-n">'+todayN+' <span>/ '+g+' 枚</span></div>' +
     '<div class="progress-line"><i style="width:'+Math.min(100,todayN/g*100)+'%"></i></div>' +
     '<div class="today-msg">'+(cleared ? '達成 ✓　この調子で続けよう'
        : 'あと '+(g-todayN)+' 枚。連続 '+streak+' 日を切らさないように。')+'</div></div>' +
   '<div class="group-head">この30日<span>◎ ノルマ達成　○ 学習　・ なし</span></div>' +
   '<div class="cal">'+cal+'</div>' +
   '<div class="group-head">バッジ<span>'+eids.length+' / '+BADGES.length+'</span></div>' +
   '<div class="badge-grid">'+badges+'</div>' +
   '<div class="group-head">数字で見る</div>' +
   '<div class="stat-grid">' +
   ['<div class="stat"><div class="stat-n">'+clearDays()+'</div><div class="stat-l">ノルマ達成した日数</div></div>',
    '<div class="stat"><div class="stat-n">'+streak+'</div><div class="stat-l">連続学習日数</div></div>',
    '<div class="stat"><div class="stat-n">'+mastered+'</div><div class="stat-l">定着（BOX4 以上）</div></div>',
    '<div class="stat"><div class="stat-n">'+all+'</div><div class="stat-l">学習した項目</div></div>',
    '<div class="stat"><div class="stat-n">'+total+'</div><div class="stat-l">累計めくった枚数</div></div>',
    '<div class="stat"><div class="stat-n">'+dueTom+'</div><div class="stat-l">明日までの復習</div></div>'].join("") + '</div>' +
   '<div class="group-head">レベル別（目安）</div><div class="tbl-wrap"><table><thead><tr><th>レベル</th><th style="text-align:right">項目</th><th style="text-align:right">学習</th><th style="text-align:right">定着</th></tr></thead><tbody>'+
   [[3,"N3 以下"],[2,"N2"],[1,"N1"]].map(x=>{
     const all=[...VOCAB,...GRAM,...SPK].filter(o=>o.lv===x[0]);
     const seen=all.filter(o=>rec(o)).length, m=all.filter(o=>rec(o)&&rec(o)[0]>=MASTER).length;
     return '<tr><td><span class="lv lv'+x[0]+'">'+LVN[x[0]]+'</span> '+x[1]+'</td><td class="n">'+all.length+
       '</td><td class="n">'+seen+'</td><td class="n">'+m+'</td></tr>'; }).join("") +
   '</tbody></table></div>' +
   '<div class="group-head">分野別</div><div class="tbl-wrap"><table><thead><tr><th>分野</th><th style="text-align:right">総数</th><th style="text-align:right">学習</th><th style="text-align:right">定着</th><th style="text-align:right">率</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
   '<div class="group-head">単語デッキ</div><div class="tbl-wrap"><table><thead><tr><th>デッキ</th><th style="text-align:right">語数</th><th style="text-align:right">定着</th><th style="text-align:right">率</th></tr></thead><tbody>'+cats+'</tbody></table></div>' +
   '<div class="group-head">設定</div>' +
   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">' +
   '<span class="note">1日の目標</span><div class="seg">'+[20,30,50,100].map(g=>'<button data-goal="'+g+'" aria-pressed="'+(st.cfg.goal===g)+'">'+g+'</button>').join("")+'</div>' +
   '<span class="note" style="margin-left:14px">ふりがな</span><div class="seg"><button data-furitoggle="1" aria-pressed="'+st.cfg.furi+'">'+(st.cfg.furi?"表示中":"非表示")+'</button></div>' +
   '<button class="chip danger" id="reset" style="margin-left:auto">学習記録を消す</button></div>' +
   '<div class="note" style="margin-top:24px">記録はこの端末のブラウザ内だけに保存されます。iPhone と PC の進捗は別々です。' +
   ('speechSynthesis' in window ? (jvoice? '音声：'+esc(jvoice.name) : '日本語音声が見つかりません。iOS は「設定 › アクセシビリティ › 読み上げコンテンツ › 声 › 日本語」から追加できます。') : '') + '</div>';
  document.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{ st.cfg.goal=+b.dataset.goal; save(); vStats(); });
  $("#reset").onclick = ()=>{ if(confirm("すべての学習記録を消します。よろしいですか？")){
    st.srs={}; st.log={}; st.best=0; save(); deck=[]; idx=0; cur=null; marks=new Map(); vStats(); } };
}

/* ============ events ============ */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));
$("#barToggle").onclick = ()=>{ st.cfg.bar = !st.cfg.bar; save(); render(); };
if(st.cfg.theme) document.documentElement.setAttribute("data-theme", st.cfg.theme);
applyFuri();
$("#themeBtn").onclick = ()=>{
  const r=document.documentElement, c=r.getAttribute("data-theme");
  const dark = c ? c==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  st.cfg.theme = dark?"light":"dark"; save();
  r.setAttribute("data-theme", st.cfg.theme); };
document.addEventListener("click", e=>{
  const s=e.target.closest("[data-say]");    if(s){ say(strip(s.dataset.say)); return; }
  const sh=e.target.closest("[data-shadow]"); if(sh){ shadowing(sh.dataset.shadow, st.cfg.shadow); return; }
  const d=e.target.closest("[data-deck]");
  if(d){ const c=d.dataset.deck, i=st.cfg.decks.indexOf(c);
    if(i<0) st.cfg.decks.push(c); else if(st.cfg.decks.length>1) st.cfg.decks.splice(i,1);
    save(); deck=[]; idx=0; cur=null; qs=[]; qi=0; render(); return; }
  const dir=e.target.closest("[data-dir]"); if(dir){ st.cfg.dir=dir.dataset.dir; save(); vCards(); return; }
  const m=e.target.closest("[data-mode]"); if(m){ st.cfg.list = m.dataset.mode==="list"; save(); vCards(); return; }
  const r=e.target.closest("[data-rate]"); if(r){ st.cfg.rate=+r.dataset.rate; save(); vSpeak(); return; }
  const n=e.target.closest("[data-sh]"); if(n){ st.cfg.shadow=+n.dataset.sh; save(); vSpeak(); return; }
  const nb=e.target.closest("[data-no]");
  if(nb){ const [t,n]=nb.dataset.no.split(":");
    st.mark[t] = (st.mark[t]===+n) ? 0 : +n; save();
    (t==="G"?vGrammar:vSpeak)(); if(st.mark[t]) jumpTo(t); return; }
  const jb=e.target.closest("[data-jump]"); if(jb){ jumpTo(jb.dataset.jump); return; }
  const cm=e.target.closest("[data-clearmark]");
  if(cm){ const t=cm.dataset.clearmark; st.mark[t]=0; save(); (t==="G"?vGrammar:vSpeak)(); return; }
  if(e.target.closest("#examTag")){
    const v = prompt("試験日を YYYY-MM-DD で入力してください", st.cfg.exam);
    if(v && /^\d{4}-\d{2}-\d{2}$/.test(v)){ st.cfg.exam=v; save(); render(); }
    return; }
  const c2=e.target.closest("[data-sc]"); if(c2){ st._sc=c2.dataset.sc; st._sq=""; vSpeak(); return; }
  const L=e.target.closest("[data-lv]");
  if(L){ const n=+L.dataset.lv, i=st.cfg.lvs.indexOf(n);
    if(i<0) st.cfg.lvs.push(n); else if(st.cfg.lvs.length>1) st.cfg.lvs.splice(i,1);
    save(); deck=[]; idx=0; cur=null; qs=[]; qi=0; render(); return; }
  const FU=e.target.closest("[data-furitoggle]");
  if(FU){ st.cfg.furi=!st.cfg.furi; save(); applyFuri(); render(); return; }
});
document.addEventListener("keydown", e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  if(st.cfg.view==="cards" && !st.cfg.list){
    if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); shown?0:flip(); return; }
    if(shown && "123".includes(e.key)){ doGrade(+e.key); return; }
    if(e.code==="ArrowLeft"||e.code==="Backspace"){ e.preventDefault(); go(-1); return; }
    if(e.code==="ArrowRight"){ e.preventDefault(); go(1); return; }
  }
  if(e.key==="f"||e.key==="F"){ st.cfg.bar=!st.cfg.bar; save(); render(); return; }
  if(st.cfg.view==="quiz"){
    if(e.code==="ArrowLeft"){ e.preventDefault(); qGo(-1); return; }
    if(e.code==="ArrowRight"||e.code==="Space"||e.code==="Enter"){ e.preventDefault(); qGo(1); return; }
    if("1234".includes(e.key)){ const b=document.querySelector('[data-o="'+(+e.key-1)+'"]'); if(b) b.click(); } }
});
render();
</script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));</script></body></html>
