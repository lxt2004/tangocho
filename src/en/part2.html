<div id="app">
  <nav id="rail" role="tablist" aria-label="学習モード">
    <div class="brand">英単語ノート</div>
    <button class="tab" role="tab" aria-controls="view" data-view="cards">単語<small>SRS</small></button>
    <button class="tab" role="tab" aria-controls="view" data-view="grammar">熟語<small>PHRASE</small></button>
    <button class="tab" role="tab" aria-controls="view" data-view="speak">例文<small>LISTEN</small></button>
    <button class="tab" role="tab" aria-controls="view" data-view="quiz">小試験<small>4択</small></button>
    <button class="tab" role="tab" aria-controls="view" data-view="stats">記録<small>LOG</small></button>
    <div class="spacer"></div>
    <button class="icon-btn" id="themeBtn" title="配色を切り替える" aria-label="配色を切り替える">◐</button>
  </nav>
  <main>
    <div class="bar">
      <div class="bar-row">
        <h1 id="vTitle">単語</h1>
        <span class="sub" id="vSub"></span>
        <span id="barQuick"></span>
        <button class="filt" id="barToggle" aria-expanded="false">絞り込み<b>▾</b></button>
      </div>
      <div id="barPanel" hidden>
        <div class="bar-row" style="margin-top:9px" id="barTools"></div>
        <div class="bar-row" style="margin-top:7px" id="barTools2"></div>
      </div>
    </div>
    <div class="wrap" id="view" role="tabpanel" tabindex="-1"></div>
  </main>
  <div id="sr" class="sr-only" role="status" aria-live="polite"></div>
  <div id="banner" hidden></div>
</div>
<script>
/*__DATA__*/

/* ============ state ============ */
const LS = "eitango-note/v1";
const DAY = 864e5;
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*6e4) / DAY);
const dstr  = () => new Date(Date.now() - new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const BOXES = [0,1,2,4,8,16,40];
const MASTER = 4;

const defState = {
  srs:{},        /* key -> [box, 次の出題日, 忘れた回数] */
  log:{},        /* 日付 -> めくった枚数（連続日数と累計に使う） */
  done:{},       /* 日付 -> 「あいまい」以上で進んだ枚数。ノルマの判定はこちら */
  qlog:{},       /* 日付 -> 小試験の解答数（ノルマには入れない） */
  best:0, mark:{}, clear:{}, quiz:{n:0,ok:0}, badges:{}, session:null,
  miss:null,     /* {d:"YYYY-MM-DD", keys:[...]} 今日まちがえた項目 */
  cfg:{ rate:.9, goal:30, dir:"jp", decks:[], view:"cards", list:false, shadow:2, reps:5,
        furi:true, lvs:[3,2], bar:false, autoNext:false, hard:false, qmode:"mix",
        exam:"2027-02-10" }
};
let st = defState;
try{ const r = localStorage.getItem(LS); if(r) st = deepMerge(defState, JSON.parse(r)); }catch(e){}
function deepMerge(a,b){ const o = Array.isArray(a)?b:Object.assign({},a);
  if(!Array.isArray(a)) for(const k in b){ o[k] = (b[k] && typeof b[k]==="object" && !Array.isArray(b[k])) ? deepMerge(a[k]||{}, b[k]) : b[k]; }
  return o; }
let saveT=null, saveFail=false;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>{
  try{ localStorage.setItem(LS, JSON.stringify(st)); saveFail=false; }
  catch(e){                      /* 容量超過などで書けないことを黙って捨てない */
    if(!saveFail){ saveFail=true;
      banner("記録を保存できませんでした。ブラウザの空き容量を確認してください。", true); } } },200); }
/* 記録が消えにくくなるよう永続化を頼んでおく（拒否されても動作は変わらない） */
if(navigator.storage && navigator.storage.persist){
  try{ navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist(); }).catch(()=>{}); }catch(e){} }

/* ============ decks ============ */
GRAM.forEach((g,i)=>g.no=i+1);
SPK.forEach((s,i)=>s.no=i+1);
const VCATS = [...new Set(VOCAB.map(v=>v.cat))];
const GCATS = [...new Set(GRAM.map(g=>g.cat))];
const SCATS = [...new Set(SPK.map(s=>s.cat))];
/* ---- 既存ユーザーの記録の移行 ---- */
if(!Object.keys(st.done).length && Object.keys(st.log).length){
  for(const d in st.log) st.done[d] = st.log[d];   // done が無い時代の記録は log を流用する
}
st.cfg.decks = st.cfg.decks.filter(c=>VCATS.includes(c));
if(!st.cfg.decks.length) st.cfg.decks = [...VCATS];

/* ============ srs ============ */
const key = it => it._t + ":" + (it.w || it.p || it.jp);
const rec = it => st.srs[key(it)];
const isDue = it => { const r = rec(it); return r && r[1] <= today(); };
const isNew = it => !rec(it);
/* 間隔に ±15% のゆらぎを入れる。固定値だと、ある日にまとめて覚えた語が
   8日後・16日後・40日後にまた同じ日へ揃って戻ってきて、波が周期的に再来する。 */
const FUZZ = d => d <= 1 ? d : Math.max(1, Math.round(d * (.85 + Math.random()*.3)));
function bump(name, d, n){ const o = st[name] || (st[name] = {});
  o[d] = (o[d]||0) + n; if(o[d] <= 0) delete o[d]; }
function grade(it, g){
  const k = key(it); const r = st.srs[k] || [0,0,0];
  let b = r[0], lapse = r[2]|0;
  if(g===3) b = Math.min(BOXES.length-1, b+1);
  else if(g===2) b = Math.max(1, b);
  else { b = 0; lapse++; }
  st.srs[k] = [b, today() + (g===1 ? 0 : g===2 ? 1 : FUZZ(BOXES[b])), lapse];
  const d = dstr();
  bump("log", d, 1);                     // めくった枚数
  if(g >= 2) bump("done", d, 1);         // 進んだ枚数。ノルマはこちらで数える
  if(g === 1) missAdd(k);
  st.best = Math.max(st.best||0, st.log[d]);
  save();
}
/* 小試験は「4つの中から選ぶ」ぶん、カードより当てやすい（4択は 25% で当たる）。
   同じ土俵で BOX を上げると実力より先に間隔が伸びてしまうので、上げない。 */
function quizMark(it, ok){
  const k = key(it), r = st.srs[k];
  if(ok){ if(!r) st.srs[k] = [1, today()+1, 0]; }        // 未学習なら足がかりだけ作る
  else {
    st.srs[k] = r ? [Math.max(0, r[0]-1), today(), (r[2]|0)+1] : [0, today(), 1];
    missAdd(k);
  }
  st.quiz.n++; if(ok) st.quiz.ok++;
  bump("qlog", dstr(), 1);
  save();
}
/* 今日まちがえた項目。日付が変わったら捨てる */
function missAdd(k){ const d = dstr();
  if(!st.miss || st.miss.d !== d) st.miss = { d, keys:[] };
  if(!st.miss.keys.includes(k)) st.miss.keys.push(k); }
const missKeys  = () => (st.miss && st.miss.d === dstr()) ? st.miss.keys : [];
const missItems = () => { const s = new Set(missKeys()); return VOCAB.filter(v=>s.has(key(v))); };
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ============ tts ============ */
let jvoice=null, shadowT=null;
function loadVoices(){ try{ const v=speechSynthesis.getVoices();
  jvoice = v.find(x=>/^en-US/i.test(x.lang)) || v.find(x=>/^en/i.test(x.lang)) || null; }catch(e){} }
if("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function utter(t,rate){ const u=new SpeechSynthesisUtterance(t); u.lang="en-US";
  if(jvoice) u.voice=jvoice; u.rate = rate ?? st.cfg.rate; return u; }
const SAY_GAP = 700;   // 連続再生の間隔(ms)。半秒〜1秒が聞き取りやすい

/* 再生の世代番号。cancel() は onend を発火させることがあり、
   そのまま次を予約すると止めたはずの音が鳴り続ける。
   世代が変わったら古い予約は捨てる。 */
let sayGen = 0;
function stopSay(){ sayGen++; clearTimeout(shadowT);
  try{ speechSynthesis.cancel(); }catch(e){} }

/* 単語・例文の発音。既定で st.cfg.reps 回くり返す。 */
function say(t,rate,times){ if(!("speechSynthesis" in window)) return;
  stopSay();
  const gen = sayGen, n = Math.max(1, times ?? st.cfg.reps ?? 1);
  let i = 0;
  const step=()=>{ if(gen !== sayGen || i++ >= n) return;
    const u = utter(t,rate);
    u.onend = ()=>{ if(gen === sayGen) shadowT = setTimeout(step, SAY_GAP); };
    speechSynthesis.speak(u); };
  step(); }

/* 音読(シャドーイング)。自分で復唱するぶん間隔を長めに取る。 */
function shadowing(t,times){ if(!("speechSynthesis" in window)) return;
  stopSay();
  const gen = sayGen; let i=0;
  const step=()=>{ if(gen !== sayGen || i++ >= times) return; const u=utter(t);
    u.onend=()=>{ if(gen === sayGen) shadowT=setTimeout(step, 700 + t.length*95); };
    speechSynthesis.speak(u); };
  step(); }
const strip = s => s.replace(/[（(][^）)]*[）)]/g,"");

/* ============ お知らせ・読み上げ ============
   画面は毎回まるごと書き換えるので、支援技術には「何が起きたか」が伝わらない。 */
function announce(t){ const el = document.getElementById("sr"); if(el) el.textContent = t; }
function banner(msg, danger, label, fn){
  const b = document.getElementById("banner"); if(!b) return;
  b.className = danger ? "danger" : "";
  b.innerHTML = '<span></span>' + (label?'<button class="chip" id="bnAct"></button>':"") +
    '<button class="chip" id="bnX" aria-label="閉じる">×</button>';
  b.firstChild.textContent = msg;
  if(label){ const a = document.getElementById("bnAct"); a.textContent = label; a.onclick = fn; }
  document.getElementById("bnX").onclick = ()=>{ b.hidden = true; };
  b.hidden = false;
}
window.__newVer = ()=>banner("新しい版があります。", false, "更新する", ()=>location.reload());

/* ============ helpers ============ */
const esc = s => String(s).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = h => { const d=document.createElement("div"); d.innerHTML=h.trim(); return d.firstElementChild; };
const $  = s => document.querySelector(s);
function spk(text,label,showN){ const n = st.cfg.reps||1;
  return '<button class="speak" data-say="'+esc(text)+'">◗ '+(label||"音声")+(showN&&n>1?' ×'+n:'')+'</button>'; }
const RUBY=/([々ヶ一-鿿]+)[（(]([^）)]+)[）)]/g;
function ruby(s){ if(!s) return "";
  return st.cfg.furi ? esc(s).replace(RUBY,(m,b,r)=>"<ruby>"+b+"<rt>"+r+"</rt></ruby>") : esc(strip(s)); }
const dstrOf = i => new Date(Date.now()-i*DAY-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
function streakDays(){ let s=0;
  for(let i=0;i<400;i++){ const d=dstrOf(i); if(st.log[d]) s++; else if(i>0) break; }
  return s; }
const clearDays  = () => Object.keys(st.clear||{}).length;
const mastered   = arr => arr.filter(x=>{ const r=rec(x); return r && r[0]>=MASTER; }).length;
const totalCards = () => Object.values(st.log).reduce((a,b)=>a+b,0);
const BADGES = [
  {id:"b1",  n:"はじめの一歩", d:"1日でも学習する",         f:()=>Object.keys(st.log).length>=1},
  {id:"b3",  n:"三日つづいた", d:"3日 連続で学習",           f:()=>streakDays()>=3},
  {id:"b7",  n:"一週間つづいた", d:"7日 連続で学習",         f:()=>streakDays()>=7},
  {id:"b14", n:"二週間つづいた", d:"14日 連続で学習",        f:()=>streakDays()>=14},
  {id:"b30", n:"一か月つづいた", d:"30日 連続で学習",        f:()=>streakDays()>=30},
  {id:"b60", n:"二か月つづいた", d:"60日 連続で学習",        f:()=>streakDays()>=60},
  {id:"c10", n:"ノルマ 10日",   d:"今日のノルマを 10日 達成", f:()=>clearDays()>=10},
  {id:"c30", n:"ノルマ 30日",   d:"今日のノルマを 30日 達成", f:()=>clearDays()>=30},
  {id:"c60", n:"ノルマ 60日",   d:"今日のノルマを 60日 達成", f:()=>clearDays()>=60},
  {id:"w100",n:"100語 定着",    d:"単語を 100語 覚えきる",    f:()=>mastered(VOCAB)>=100},
  {id:"w300",n:"300語 定着",    d:"単語を 300語 覚えきる",    f:()=>mastered(VOCAB)>=300},
  {id:"w500",n:"500語 定着",    d:"単語を 500語 覚えきる",    f:()=>mastered(VOCAB)>=500},
  {id:"p80", n:"熟語 80",       d:"熟語を 80 覚えきる",       f:()=>mastered(GRAM)>=80},
  {id:"t1000",n:"のべ 1000枚",  d:"のべ 1000枚 めくる",       f:()=>totalCards()>=1000},
  {id:"q80", n:"小テスト達人",  d:"50問以上で正答率 80%",     f:()=>st.quiz.n>=50 && st.quiz.ok/st.quiz.n>=.8},
];
function earnedIds(){                    // 一度取ったバッジは永久に保持する
  let changed = false;
  BADGES.forEach(b=>{ let ok=false; try{ ok=b.f(); }catch(e){}
    if(ok && !st.badges[b.id]){ st.badges[b.id]=dstr(); changed=true; } });
  if(changed) save();
  return Object.keys(st.badges); }
let justCleared = null;
const plain = s => String(s||"").replace(/[（(][^）)]*[）)]/g,"");
const LVN={3:"基礎",2:"標準",1:"発展"};
const pill = it => '<span class="lv lv'+it.lv+'">'+LVN[it.lv]+'</span>';
const lvOK = it => st.cfg.lvs.includes(it.lv);
function lvChips(){ return '<div class="chips">' +
  [[3,"基礎 中1-2"],[2,"標準 中3"],[1,"発展 入試"]].map(x=>'<button class="chip" data-lv="'+x[0]+'" aria-pressed="'+st.cfg.lvs.includes(x[0])+'">'+x[1]+'</button>').join("") +
  '<button class="chip" data-furitoggle="1" aria-pressed="'+st.cfg.furi+'" style="margin-left:14px">ふりがな</button></div>'; }
function noBtn(t, n){ return '<button class="no'+(st.mark[t]===n?" on":"")+'" data-no="'+t+':'+n+
  '" title="ここにしおりを挟む／外す">'+n+'</button>'; }
function resumeBar(t){ const n = st.mark[t];
  return n ? '<div class="resume">しおり <b>#'+n+'</b> <button class="chip" data-jump="'+t+'">そこへ移動</button>' +
    '<button class="chip" data-clearmark="'+t+'">外す</button></div>' : ""; }
function jumpTo(t){ const el = document.querySelector('[data-no="'+t+':'+st.mark[t]+'"]');
  if(el) el.closest(".row").scrollIntoView({block:"center"}); }
function daysLeft(){ const d=Math.ceil((new Date(st.cfg.exam+"T00:00:00")-new Date())/864e5); return isNaN(d)?null:d; }
function streakTag(){ const s=streakDays();
  return s>0 ? '<span class="streak">連続 '+s+' 日</span>' : ""; }
function countdown(){ const d=daysLeft();
  return d===null?"":'<span class="countdown" id="examTag" title="クリックで入試日を変更">入試まで あと '+
    (d>0?d+" 日":"—")+'</span>'; }
function applyFuri(){ document.documentElement.setAttribute("data-furi", st.cfg.furi?"on":"off"); }

/* ============ views ============ */
let deck=[], idx=0, cur=null, shown=false, marks=new Map(), qs=[], qi=0, quizN=0, quizOK=0;
const syncCur = ()=>{ cur = deck[idx] || null; };

function setView(v){ stopSay(); st.cfg.view=v; save(); render();
  const el = $("#view"); if(el) el.focus({preventScroll:true}); }
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t.dataset.view===st.cfg.view));
  ({cards:vCards, grammar:vGrammar, speak:vSpeak, quiz:vQuiz, stats:vStats})[st.cfg.view]();
}
function head(title, sub, tools, tools2, quick){
  $("#vTitle").textContent=title; $("#vSub").innerHTML=sub||"";
  $("#barQuick").innerHTML = quick||"";
  $("#barTools").innerHTML = tools||""; $("#barTools2").innerHTML = tools2||"";
  const has = !!(tools||tools2), t = $("#barToggle");
  t.style.display = has ? "" : "none";
  t.innerHTML = '絞り込み<b>'+(st.cfg.bar?"▴":"▾")+'</b>';
  t.setAttribute("aria-expanded", String(!!st.cfg.bar));
  t.classList.toggle("on", st.cfg.decks.length < VCATS.length || st.cfg.lvs.length < 3);
  $("#barPanel").hidden = !has || !st.cfg.bar; }

/* ---- 単語 ---- */
/* 忘れた回数がこれ以上なら「苦手」。何度も落とす語だけを拾えるようにする。 */
const HARD = 2;
const isHard = it => { const r = rec(it); return r && (r[2]|0) >= HARD; };
const hardCount = () => VOCAB.filter(v=>st.cfg.decks.includes(v.cat) && lvOK(v) && isHard(v)).length;
function pool(){ const p = VOCAB.filter(v=>st.cfg.decks.includes(v.cat) && lvOK(v));
  return st.cfg.hard ? p.filter(isHard) : p; }
/* 絞り込み後の並びでの通し番号(1 始まり)。0 なら見つからない */
const noOf = (p,it) => p.indexOf(it) + 1;

/* ---- 前回の続きから ----
   山札(deck)は毎回組み直す作りだったので、アプリを閉じると必ず先頭に戻っていた。
   山札の中身と位置を保存し、絞り込み条件が同じなら次に開いたとき復元する。 */
const sameSet = (a,b) => a.length===b.length &&
  a.map(String).sort().join("|") === b.map(String).sort().join("|");

function saveSession(){
  st.session = { keys: deck.map(key), i: idx,
                 decks: st.cfg.decks.slice(), lvs: st.cfg.lvs.slice(), hard: !!st.cfg.hard };
  save(); }

function restoreSession(){
  const s = st.session;
  if(!s || !Array.isArray(s.keys) || !s.keys.length) return false;
  // 絞り込みを変えたあとの山札は噛み合わないので作り直す
  if(!sameSet(s.decks||[], st.cfg.decks) || !sameSet(s.lvs||[], st.cfg.lvs)) return false;
  if(!!s.hard !== !!st.cfg.hard) return false;
  const byKey = new Map(VOCAB.map(v=>[key(v), v]));
  const d = s.keys.map(k=>byKey.get(k)).filter(Boolean);
  if(!d.length) return false;
  const i = Math.max(0, s.i|0);
  if(i >= d.length) return false;      // 前回やり切っていた → 次の分を組む
  deck = d; idx = Math.min(i, d.length-1);
  marks = new Map(); shown = false; syncCur();
  return true; }

/* 絞り込み後の並び順で n 番目(1 始まり)から、目標枚数ぶんを順番に出す */
function startFrom(n){
  const p = pool();
  if(!p.length) return;
  const s0 = Math.min(Math.max(0, n-1), p.length-1);
  deck = p.slice(s0, s0 + Math.max(1, st.cfg.goal));
  idx = 0; marks = new Map(); shown = false; syncCur();
  st.cfg.list = false; saveSession(); vCards(); }

/* 溜まった復習を全部積むと「1 / 270」になって心が折れる。
   1 日ぶん（ノルマの 2 倍）で切って、残りは翌日に回す。 */
const dueCap = () => st.cfg.goal * 2;
const carryOver = () => Math.max(0, pool().filter(isDue).length - dueCap());
function buildQueue(){
  const p = pool();
  if(st.cfg.hard){
    /* 「苦手だけ」は予定を待つ機能ではなく、いま集中して潰すための機能。
       次の出題日が来ていなくても全部まわす。 */
    deck = shuffle(p).slice(0, dueCap());
  } else {
    const due = shuffle(p.filter(isDue)).slice(0, dueCap());
    const fresh = p.filter(isNew);
    deck = due.concat(fresh.slice(0, Math.max(0, st.cfg.goal - due.length)));
  }
  idx = 0; marks = new Map(); shown = false; syncCur();
  saveSession();
}
/* 今日まちがえた語だけをもう一度まわす */
function startMiss(){
  const d = missItems(); if(!d.length) return;
  deck = shuffle(d); idx = 0; marks = new Map(); shown = false; syncCur();
  st.cfg.list = false; saveSession(); vCards();
}
function deckChips(){
  return '<div class="chips">' + VCATS.map(c=>{
    const inCat = VOCAB.filter(v=>v.cat===c && lvOK(v));
    const n = inCat.filter(v=>{ const r=rec(v); return r && r[0]>=MASTER; }).length;
    const t = inCat.length;
    return '<button class="chip" data-deck="'+esc(c)+'" aria-pressed="'+st.cfg.decks.includes(c)+'">'+esc(c)+' <span style="font-family:var(--mono);font-size:11px;opacity:.7">'+n+'/'+t+'</span></button>';
  }).join("") + '</div>';
}
function vCards(){
  const p = pool();
  const dueN = p.filter(isDue).length, newN = p.filter(isNew).length;
  const done = st.done[dstr()]||0, carry = carryOver(), miss = missItems().length, hn = hardCount();
  head("単語", (st.cfg.list?"一覧 ":"") + p.length + " 語 / " +
      (st.cfg.hard ? "苦手だけ" :
        "復習 " + dueN + (carry ? "（今日は "+dueCap()+" 枚・持ち越し "+carry+"）" : "") +
        " / 未学習 " + newN) +
      " / 今日 " + done,
    deckChips() +
    '<div style="display:flex;gap:8px;margin-left:auto;flex-wrap:wrap">' +

function go(d){                       // 採点せずに移動するだけ
  const n = idx + d;
  if(n < 0 || n > deck.length) return;
  stopSay();                          // 前のカードの連続再生を止める
  idx = n; shown = false; syncCur(); saveSession(); vCards(); }
function doGrade(g){
  if(!cur) return;
  stopSay();
  const k = key(cur);
  let m = marks.get(cur);
  if(m){                              // このセッションで採点済み → 前回分を取り消す
    if(m.rec) st.srs[k] = m.rec.slice(); else delete st.srs[k];
    bump("log", m.day, -1);
    if(m.g >= 2) bump("done", m.day, -1);
    if(m.g===1){ const j = deck.indexOf(cur, idx+1); if(j>=0) deck.splice(j,1); }
  } else {
    m = { rec: st.srs[k] ? st.srs[k].slice() : null };
    marks.set(cur, m);
  }
  const e0 = earnedIds();
  grade(cur, g);
  m.g = g; m.day = dstr();
  const d0 = dstr();
  if(!st.clear[d0] && (st.done[d0]||0) >= st.cfg.goal){
    st.clear[d0] = true;
    justCleared = { n: st.done[d0], streak: streakDays(),
                    got: BADGES.filter(b=>earnedIds().includes(b.id) && !e0.includes(b.id)) };
  } else {
    const nb = BADGES.filter(b=>earnedIds().includes(b.id) && !e0.includes(b.id));
    if(nb.length) justCleared = { badgeOnly:true, got:nb };
  }
  if(g===1) deck.push(cur);
  const v = Object.values(st.log); st.best = v.length ? Math.max(...v) : 0;
  idx++; shown=false; syncCur();
  saveSession();                      // 採点で山札も位置も変わるので保存する
  vCards(); }

/* ---- 小試験 ---- */
/* スペルの判定。大文字小文字・前後の空白・終わりの記号は無視する。
   入試ではスペルミスがそのまま失点になるので、選ぶ問題だけでは足りない。 */
const NORM = s => String(s||"").toLowerCase().trim()
  .replace(/[.,!?;:"']/g,"").replace(/\s+/g," ");
const answerOK = (v, s) => { const x = NORM(s); return !!x && x === NORM(v.w); };

function mkQ(){
  const p = pool(); if(p.length<4) return null;
  /* 4択だけだと「見れば分かる」で終わる。意味からスペルを書く題を混ぜる。 */
  if(st.cfg.qmode !== "choice" && (st.cfg.qmode === "type" || Math.random() < .3)){
    const a = p[Math.floor(Math.random()*p.length)];
    return { type:true, q:plain(a.r)+"　"+a.c, tip:"意味 → 英語（スペルを入力）", it:a }; }
  const kind = Math.random();
  if(kind < .38){ const a = p[Math.floor(Math.random()*p.length)];
    const d = shuffle(p.filter(x=>x!==a && x.cat===a.cat)).slice(0,3);
    return { q:plain(a.r)+"　"+a.c, qz:true, tip:"意味 → 英語", it:a,
      opts: shuffle([a,...d]).map(x=>({t:x.w, en:true, ok:x===a})) }; }
  if(kind < .72){ const a = p[Math.floor(Math.random()*p.length)];
    const d = shuffle(p.filter(x=>x!==a && x.cat===a.cat)).slice(0,3);
    return { q:a.w, en:true, tip:"英語 → 意味", it:a,
      opts: shuffle([a,...d]).map(x=>({t:plain(x.r)+"　"+x.c, ok:x===a})) }; }
  const gp = GRAM.filter(lvOK);
  if(gp.length < 4){ const v = p[Math.floor(Math.random()*p.length)];
    const vd = shuffle(p.filter(x=>x!==v)).slice(0,3);
    return { q:v.w, en:true, tip:"英語 → 意味", it:v, opts: shuffle([v,...vd]).map(x=>({t:plain(x.r)+"　"+x.c, ok:x===v})) }; }
  const a = gp[Math.floor(Math.random()*gp.length)];
  const d = shuffle(gp.filter(x=>x!==a)).slice(0,3);
  const core = a.p.replace(/[~〜]/g," ").replace(/\s+/g," ").trim();
  const rx = new RegExp(core.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "i");
  const blanked = rx.test(a.ex) ? a.ex.replace(rx, "______") : a.ex;
  return { q: blanked, en:true, zhq:plain(a.note),
    tip: rx.test(a.ex) ? "空所に入る熟語" : "この英文に合う熟語", it:{...a,_t:"G"},
    opts: shuffle([a,...d]).map(x=>({t:x.p+"　"+plain(x.note), ok:x===a})) };
}
const curQ = ()=> qs[qi] || null;
function qGo(d){
  stopSay();                          // 前の問題の連続再生を止める
  if(d < 0){ if(qi>0){ qi--; vQuiz(); } return; }
  if(qi < qs.length-1){ qi++; }
  else { const nq = mkQ(); if(!nq) return; qs.push(nq); qi = qs.length-1;
         if(qs.length > 60){ qs.shift(); qi--; } }
  vQuiz(); }
function vQuiz(){
  head("小試験", quizN? ("正解 "+quizOK+" / "+quizN+"　"+Math.round(quizOK/quizN*100)+"%") : "単語と熟語",
    deckChips() +
    '<div class="seg" style="margin-left:auto" title="出題の形式">' +
    [["mix","混合"],["choice","4択"],["type","スペル"]].map(x=>
      '<button data-qmode="'+x[0]+'" aria-pressed="'+(st.cfg.qmode===x[0])+'">'+x[1]+'</button>').join("") +
    '</div>',
    lvChips());
  if(!qs.length){ const nq = mkQ(); if(nq){ qs.push(nq); qi = 0; } }
  const q = curQ();
  if(!q){ $("#view").innerHTML='<div class="empty">出題できる項目が足りません。デッキとレベルを選び直してください。</div>'; return; }
  const it = q.it;
  $("#view").innerHTML =
    '<div class="card"><div class="tag">'+pill(it)+' '+esc(q.tip)+
      '<span style="margin-left:auto">Q'+(qi+1)+' / '+qs.length+'</span></div>' +
    '<div class="q'+(q.q.length>16?" small":"")+'" '+(q.en?'style="font-family:var(--en)"':'style="font-family:var(--ui)"')+'>'+esc(q.q)+'</div>' +
    (q.zhq?'<div class="row-zh" style="margin-top:8px;font-size:14.5px">'+esc(q.zhq)+'</div>':"") + '</div>' +
    (q.type ? typeBox(q) : '<div class="opts">'+q.opts.map((o,i)=>{
      let cls = "opt";
      if(q._done){ if(o.ok) cls += " right"; else if(i===q.picked) cls += " wrong"; }
      return '<button class="'+cls+'" data-o="'+i+'"'+(q._done?" disabled":"")+'><span'+(o.en?' class="en"':' class="zh"')+'>'+esc(o.t)+'</span></button>';
    }).join("")+'</div>') +
    (q._done && it.ex ? '<div class="card" style="margin-top:14px;padding:18px 20px">' +
       '<div class="ex-en">'+esc(it.ex)+'</div><div class="ex-jp" style="margin-top:6px">'+ruby(it.exc||"")+'</div></div>' : "") +
    '<div class="foot"><button class="nav" id="qPrev"'+(qi>0?"":" disabled")+
      ' title="採点済みの問題を見返す">← 前へ<b><kbd>←</kbd></b></button>' +
    '<button class="nav" id="qNext">次へ →<b><kbd>→</kbd></b></button>' +
    '<button class="nav tog" id="autoNext" aria-pressed="'+(!!st.cfg.autoNext)+
      '" title="正解したとき、自動で次の問題へ進むかどうか">自動で次へ<b>'+(st.cfg.autoNext?"ON":"OFF")+'</b></button>' +
    '<span class="note">'+(q._done?"回答済み":"未回答")+'</span></div>';
  if(!q._done) document.querySelectorAll("[data-o]").forEach((b,i)=>b.onclick=()=>answer(i));
  if(q.type && !q._done){
    const ta = $("#ta");
    ta.onkeydown = ev=>{ if(ev.key==="Enter"){ ev.preventDefault(); typeAnswer(); } };
    $("#tsend").onclick = typeAnswer;
    $("#tskip").onclick = typeSkip;
    ta.focus();
  }
  $("#qPrev").onclick = ()=>qGo(-1);
  $("#qNext").onclick = ()=>qGo(1);
  $("#autoNext").onclick = ()=>{ st.cfg.autoNext = !st.cfg.autoNext; save(); vQuiz(); };
}
/* スペル入力の解答欄と答え合わせ */
function typeBox(q){
  const v = q.it;
  if(!q._done) return '<div class="typing">' +
    '<input class="field" id="ta" autocomplete="off" autocapitalize="off" autocorrect="off" ' +
      'spellcheck="false" enterkeyhint="done" placeholder="englishと入力" aria-label="スペルを入力">' +
    '<div class="type-btns"><button class="chip" id="tsend">答え合わせ</button>' +
    '<button class="chip" id="tskip">わからない</button></div></div>';
  return '<div class="typing"><div class="type-res '+(q.right?"right":"wrong")+'">' +
    (q.right ? "正解" : (q.typed ? "「"+esc(q.typed)+"」は違います" : "答え")) + '</div>' +
    '<div class="type-ans"><span class="type-w">'+esc(v.w)+'</span>'+spk(v.w,"単語",0)+'</div></div>';
}
function typeAnswer(){
  const q = curQ(); if(!q || !q.type || q._done) return;
  const el = $("#ta"); q.typed = el ? el.value : "";
  if(!NORM(q.typed)) return;              // 空のまま押しても不正解にはしない
  const ok = answerOK(q.it, q.typed);
  q._done = true; q.right = ok;
  quizN++; if(ok) quizOK++;
  quizMark(q.it, ok);
  vQuiz(); announce(ok ? "正解" : "不正解。答えは "+q.it.w);
  say(q.it.w);
  if(ok && st.cfg.autoNext) setTimeout(()=>{ if(curQ()===q && st.cfg.view==="quiz") qGo(1); }, 1200);
}
function typeSkip(){
  const q = curQ(); if(!q || !q.type || q._done) return;
  q.typed = ""; q._done = true; q.right = false;
  quizN++; quizMark(q.it, false);
  vQuiz(); announce("答えは "+q.it.w);
  say(q.it.w);
}
function answer(i){
  const q = curQ(); if(!q || q._done) return;
  q._done = true; q.picked = i;
  const ok = q.opts[i].ok; quizN++; if(ok) quizOK++;
  quizMark(q.it, ok);
  vQuiz(); announce(ok ? "正解" : "不正解");
  if(q.it.ex) say(q.it.ex);
  // 既定は止まる。トグル ON のときだけ正解で自動送り（不正解は常に止まる）
  if(ok && st.cfg.autoNext) setTimeout(()=>{ if(curQ()===q && st.cfg.view==="quiz") qGo(1); }, 900);
}

/* ---- 記録 ---- */
function vStats(){
  head("記録", "学習の積み上げ");
  const t=dstr(), all=Object.keys(st.srs).length;
  const mastered = Object.values(st.srs).filter(r=>r[0]>=MASTER).length;
  const dueTom = Object.values(st.srs).filter(r=>r[1]<=today()+1).length;
  const days = Object.keys(st.log).length;
  const total = Object.values(st.log).reduce((a,b)=>a+b,0);
  let streak=0;
  for(let i=0;i<400;i++){ const d=new Date(Date.now()-i*DAY-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
    if(st.log[d]) streak++; else if(i>0) break; }
  const rows = [
    ["単語", VOCAB, v=>"V:"+v.w], ["熟語", GRAM, g=>"G:"+g.p], ["例文", SPK, s=>"S:"+s.jp]
  ].map(([n,arr,k])=>{
    const seen = arr.filter(x=>st.srs[k(x)]).length;
    const m = arr.filter(x=>st.srs[k(x)] && st.srs[k(x)][0]>=MASTER).length;
    return '<tr><td>'+n+'</td><td class="n">'+arr.length+'</td><td class="n">'+seen+'</td><td class="n">'+m+
      '</td><td class="n">'+Math.round(m/arr.length*100)+'%</td></tr>'; }).join("");
  const cats = VCATS.map(c=>{ const a=VOCAB.filter(v=>v.cat===c);
    const m=a.filter(v=>{ const r=rec(v); return r && r[0]>=MASTER; }).length;
    return '<tr><td>'+esc(c)+'</td><td class="n">'+a.length+'</td><td class="n">'+m+'</td><td class="n">'+Math.round(m/a.length*100)+'%</td></tr>'; }).join("");
  const g = st.cfg.goal, todayN = st.done[t]||0, cleared = !!st.clear[t];
  const qToday = (st.qlog||{})[t]||0;
  // 直近30日：◎=ノルマ達成 ○=学習した ・=なし
  let cal="";
  for(let i=29;i>=0;i--){ const d=dstrOf(i), n=st.done[d]||0, fl=st.log[d]||0;
    const cls = st.clear[d] ? "d3" : fl>0 ? "d2" : "d1";
    const mk  = st.clear[d] ? "◎" : fl>0 ? "○" : "・";
    cal += '<span class="cell '+cls+'" title="'+d+'　進んだ '+n+' 枚 / めくった '+fl+' 枚">'+mk+'</span>'; }
  /* 何度も落としている語。単語の穴はここに出る */
  const hard = VOCAB.filter(isHard).sort((a,b)=>(rec(b)[2]|0)-(rec(a)[2]|0)).slice(0,24);
  const eids = earnedIds();
  const badges = BADGES.map(b=>{ const got = eids.includes(b.id);
    return '<div class="badge-card'+(got?" got":"")+'"><div class="badge-n">'+esc(b.n)+'</div>' +
      '<div class="badge-d">'+esc(b.d)+'</div>' +
      '<div class="badge-s">'+(got?"獲得 "+st.badges[b.id]:"未獲得")+'</div></div>'; }).join("");
  $("#view").innerHTML =
   '<div class="today-card'+(cleared?" done":"")+'">' +
     '<div class="today-l">今日のノルマ</div>' +
     '<div class="today-n">'+todayN+' <span>/ '+g+' 枚</span></div>' +
     '<div class="progress-line"><i style="width:'+Math.min(100,todayN/g*100)+'%"></i></div>' +
     '<div class="today-msg">'+(cleared ? '達成 ✓　この調子で続けよう'
        : 'あと '+(g-todayN)+' 枚。連続 '+streak+' 日を切らさないように。')+
        '<br><span class="note">「あいまい」以上で進んだ枚数で数えます。' +
        'めくった枚数は '+(st.log[t]||0)+' 枚' + (qToday?'、小試験 '+qToday+' 問':'') + '。</span></div></div>' +
   '<div class="group-head">この30日<span>◎ ノルマ達成　○ 学習　・ なし</span></div>' +
   '<div class="cal">'+cal+'</div>' +
   (hard.length ? '<div class="group-head">よく忘れる語<span>'+VOCAB.filter(isHard).length+' 語</span></div>' +
     '<div class="hard-grid">' + hard.map(v=>
       '<button class="hard-item" data-from="'+esc(v.w)+'" title="この語からカードを始める">' +
       '<span class="hard-w">'+esc(v.w)+'</span>' +
       '<span class="hard-c">'+esc(v.c)+'</span>' +
       '<span class="hard-n">忘れ '+(rec(v)[2]|0)+'</span></button>').join("") + '</div>' +
     '<div class="note">押すとその語からカードが始まります。カード画面の「苦手だけ」で ' +
     HARD + ' 回以上落とした語だけをまわせます。</div>' : "") +
   '<div class="group-head">バッジ<span>'+eids.length+' / '+BADGES.length+'</span></div>' +
   '<div class="badge-grid">'+badges+'</div>' +
   '<div class="group-head">数字で見る</div>' +
   '<div class="stat-grid">' +
   ['<div class="stat"><div class="stat-n">'+clearDays()+'</div><div class="stat-l">ノルマ達成した日数</div></div>',
    '<div class="stat"><div class="stat-n">'+streak+'</div><div class="stat-l">連続学習日数</div></div>',
    '<div class="stat"><div class="stat-n">'+mastered+'</div><div class="stat-l">定着（BOX4 以上）</div></div>',
    '<div class="stat"><div class="stat-n">'+all+'</div><div class="stat-l">学習した項目</div></div>',
    '<div class="stat"><div class="stat-n">'+total+'</div><div class="stat-l">累計めくった枚数</div></div>',
    '<div class="stat"><div class="stat-n">'+dueTom+'</div><div class="stat-l">明日までの復習</div></div>',
    '<div class="stat"><div class="stat-n">'+st.quiz.n+'</div><div class="stat-l">小試験 のべ問題数'+
      (st.quiz.n?'（正答 '+Math.round(st.quiz.ok/st.quiz.n*100)+'%）':'')+'</div></div>',
    '<div class="stat"><div class="stat-n">'+VOCAB.filter(isHard).length+'</div><div class="stat-l">よく忘れる語（'+HARD+'回以上）</div></div>'].join("") + '</div>' +
   '<div class="group-head">レベル別（目安）</div><div class="tbl-wrap"><table><thead><tr><th>レベル</th><th style="text-align:right">項目</th><th style="text-align:right">学習</th><th style="text-align:right">定着</th></tr></thead><tbody>'+
   [[3,"基礎"],[2,"標準"],[1,"発展"]].map(x=>{
     const all=[...VOCAB,...GRAM,...SPK].filter(o=>o.lv===x[0]);
     const seen=all.filter(o=>rec(o)).length, m=all.filter(o=>rec(o)&&rec(o)[0]>=MASTER).length;
     return '<tr><td><span class="lv lv'+x[0]+'">'+LVN[x[0]]+'</span> '+x[1]+'</td><td class="n">'+all.length+
       '</td><td class="n">'+seen+'</td><td class="n">'+m+'</td></tr>'; }).join("") +
   '</tbody></table></div>' +
   '<div class="group-head">分野別</div><div class="tbl-wrap"><table><thead><tr><th>分野</th><th style="text-align:right">総数</th><th style="text-align:right">学習</th><th style="text-align:right">定着</th><th style="text-align:right">率</th></tr></thead><tbody>'+rows+'</tbody></table></div>' +
   '<div class="group-head">単語デッキ</div><div class="tbl-wrap"><table><thead><tr><th>デッキ</th><th style="text-align:right">語数</th><th style="text-align:right">定着</th><th style="text-align:right">率</th></tr></thead><tbody>'+cats+'</tbody></table></div>' +
   '<div class="group-head">設定</div>' +
   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">' +
   '<span class="note">1日の目標</span><div class="seg">'+[20,30,50,100].map(g=>'<button data-goal="'+g+'" aria-pressed="'+(st.cfg.goal===g)+'">'+g+'</button>').join("")+'</div>' +
   '<span class="note" style="margin-left:14px">ふりがな</span><div class="seg"><button data-furitoggle="1" aria-pressed="'+st.cfg.furi+'">'+(st.cfg.furi?"表示中":"非表示")+'</button></div>' +
   '</div>' +
   '<div class="group-head">記録の持ち出し</div>' +
   '<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:14px">' +
   '<button class="chip" id="expBtn">ファイルに書き出す</button>' +
   '<label class="chip" for="impFile" style="cursor:pointer">ファイルから読み込む</label>' +
   '<input type="file" id="impFile" accept="application/json,.json" style="display:none">' +
   '<button class="chip danger" id="reset" style="margin-left:auto">学習記録を消す</button></div>' +
   '<div class="note" style="margin-top:24px">記録はこの端末のブラウザ内だけに保存されます。iPhone と PC の進捗は別々です。' +
   '機種を変えるとき、しばらく開かずに記録が消えたときのために、ときどき書き出しておいてください。' +
   ('speechSynthesis' in window ? (jvoice? '音声：'+esc(jvoice.name) : '日本語音声が見つかりません。iOS は「設定 › アクセシビリティ › 読み上げコンテンツ › 声 › 日本語」から追加できます。') : '') + '</div>';
  document.querySelectorAll("[data-goal]").forEach(b=>b.onclick=()=>{ st.cfg.goal=+b.dataset.goal; save(); vStats(); });
  $("#expBtn").onclick = exportData;
  $("#impFile").onchange = e=>{ const f=e.target.files&&e.target.files[0]; if(f) importData(f); };
  $("#reset").onclick = ()=>{ if(confirm("すべての学習記録を消します。バッジ・達成日・しおりも消えます。よろしいですか？")){
    /* 中途半端に残すと、カレンダーに ◎ が残ったまま枚数が 0 になる／
       消した直後に前回の山札が復元される、といった食い違いが出る。 */
    st.srs={}; st.log={}; st.done={}; st.qlog={}; st.clear={}; st.badges={};
    st.quiz={n:0,ok:0}; st.best=0; st.session=null; st.miss=null; st.mark={};
    save();
    deck=[]; idx=0; cur=null; marks=new Map(); qs=[]; qi=0; quizN=0; quizOK=0; justCleared=null;
    vStats(); } };
}

/* ============ 記録の持ち出し ============
   保存先が localStorage だけなので、機種変更や Safari の自動削除で消える。 */
function exportData(){
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(st)], {type:"application/json"}));
    a.download = "eitango-" + dstr() + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    banner("書き出しました。iCloud か Google ドライブに置いておくと安心です。");
  }catch(e){ banner("書き出せませんでした。", true); }
}
function importData(file){
  const rd = new FileReader();
  rd.onload = ()=>{
    let o = null;
    try{ o = JSON.parse(rd.result); }catch(e){}
    if(!o || typeof o !== "object" || !o.srs){
      banner("読み込めませんでした。このアプリで書き出したファイルを選んでください。", true); return; }
    const n = Object.keys(o.srs).length;
    if(!confirm("いまの記録を、読み込んだファイル（"+n+" 項目）で置き換えます。よろしいですか？")) return;
    try{
      st = deepMerge(defState, o);
      localStorage.setItem(LS, JSON.stringify(st));
      location.reload();
    }catch(e){ banner("保存できませんでした。", true); }
  };
  rd.onerror = ()=>banner("ファイルを読めませんでした。", true);
  rd.readAsText(file);
}

/* ============ events ============ */
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>setView(t.dataset.view));
$("#barToggle").onclick = ()=>{ st.cfg.bar = !st.cfg.bar; save(); render(); };
if(st.cfg.theme) document.documentElement.setAttribute("data-theme", st.cfg.theme);
applyFuri();
$("#themeBtn").onclick = ()=>{
  const r=document.documentElement, c=r.getAttribute("data-theme");
  const dark = c ? c==="dark" : matchMedia("(prefers-color-scheme:dark)").matches;
  st.cfg.theme = dark?"light":"dark"; save();
  r.setAttribute("data-theme", st.cfg.theme); };
document.addEventListener("click", e=>{
  const s=e.target.closest("[data-say]");    if(s){ say(strip(s.dataset.say)); return; }
  const sh=e.target.closest("[data-shadow]"); if(sh){ shadowing(sh.dataset.shadow, st.cfg.shadow); return; }
  const d=e.target.closest("[data-deck]");
  if(d){ const c=d.dataset.deck, i=st.cfg.decks.indexOf(c);
    if(i<0) st.cfg.decks.push(c); else if(st.cfg.decks.length>1) st.cfg.decks.splice(i,1);
    save(); deck=[]; idx=0; cur=null; qs=[]; qi=0; render(); return; }
  const dir=e.target.closest("[data-dir]"); if(dir){ st.cfg.dir=dir.dataset.dir; save(); vCards(); return; }
  const m=e.target.closest("[data-mode]"); if(m){ st.cfg.list = m.dataset.mode==="list"; save(); vCards(); return; }
  const jn=e.target.closest("[data-jumpno]");
  if(jn){ const el=$("#jumpNo"), n=parseInt(el&&el.value,10);
    if(n>0) startFrom(n); return; }
  const fr=e.target.closest("[data-from]");
  if(fr){ const w=fr.dataset.from;
    st.cfg.view="cards"; st.cfg.list=false;
    if(st.cfg.hard && !pool().some(x=>x.w===w)) st.cfg.hard=false;  // 絞り込みで見えない語なら外す
    const i=pool().findIndex(x=>x.w===w);
    if(i>=0) startFrom(i+1); else render();
    return; }
  const rp=e.target.closest("[data-reps]"); if(rp){ st.cfg.reps=+rp.dataset.reps; save(); vCards(); return; }
  const hd=e.target.closest("[data-hard]");
  if(hd){ st.cfg.hard=!st.cfg.hard; save(); deck=[]; idx=0; cur=null; qs=[]; qi=0; render(); return; }
  const ms=e.target.closest("[data-miss]"); if(ms){ startMiss(); return; }
  const qm=e.target.closest("[data-qmode]");
  if(qm){ st.cfg.qmode=qm.dataset.qmode; save(); qs=[]; qi=0; vQuiz(); return; }
  const r=e.target.closest("[data-rate]"); if(r){ st.cfg.rate=+r.dataset.rate; save(); vSpeak(); return; }
  const n=e.target.closest("[data-sh]"); if(n){ st.cfg.shadow=+n.dataset.sh; save(); vSpeak(); return; }
  const nb=e.target.closest("[data-no]");
  if(nb){ const [t,n]=nb.dataset.no.split(":");
    st.mark[t] = (st.mark[t]===+n) ? 0 : +n; save();
    (t==="G"?vGrammar:vSpeak)(); if(st.mark[t]) jumpTo(t); return; }
  const jb=e.target.closest("[data-jump]"); if(jb){ jumpTo(jb.dataset.jump); return; }
  const cm=e.target.closest("[data-clearmark]");
  if(cm){ const t=cm.dataset.clearmark; st.mark[t]=0; save(); (t==="G"?vGrammar:vSpeak)(); return; }
  if(e.target.closest("#examTag")){
    const v = prompt("入試日を YYYY-MM-DD で入力してください", st.cfg.exam);
    if(v && /^\d{4}-\d{2}-\d{2}$/.test(v)){ st.cfg.exam=v; save(); render(); }
    return; }
  const c2=e.target.closest("[data-sc]"); if(c2){ st._sc=c2.dataset.sc; st._sq=""; vSpeak(); return; }
  const L=e.target.closest("[data-lv]");
  if(L){ const n=+L.dataset.lv, i=st.cfg.lvs.indexOf(n);
    if(i<0) st.cfg.lvs.push(n); else if(st.cfg.lvs.length>1) st.cfg.lvs.splice(i,1);
    save(); deck=[]; idx=0; cur=null; qs=[]; qi=0; render(); return; }
  const FU=e.target.closest("[data-furitoggle]");
  if(FU){ st.cfg.furi=!st.cfg.furi; save(); applyFuri(); render(); return; }
});
document.addEventListener("keydown", e=>{
  if(/INPUT|TEXTAREA/.test(e.target.tagName)) return;
  /* お祝い画面が出ているあいだ、Space でめくったことにして 1/2/3 を通すと
     画面に何も出ていないまま次々に採点されてしまう。ここで止める。 */
  if(justCleared){
    if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); const b=$("#goOn"); if(b) b.click(); }
    return; }
  if(st.cfg.view==="cards" && !st.cfg.list){
    if(e.code==="Space"||e.code==="Enter"){ e.preventDefault(); shown?0:flip(); return; }
    if(shown && "123".includes(e.key)){ doGrade(+e.key); return; }
    if(e.code==="ArrowLeft"||e.code==="Backspace"){ e.preventDefault(); go(-1); return; }
    if(e.code==="ArrowRight"){ e.preventDefault(); go(1); return; }
  }
  if(e.key==="f"||e.key==="F"){ st.cfg.bar=!st.cfg.bar; save(); render(); return; }
  if(st.cfg.view==="quiz"){
    if(e.code==="ArrowLeft"){ e.preventDefault(); qGo(-1); return; }
    if(e.code==="ArrowRight"||e.code==="Space"||e.code==="Enter"){ e.preventDefault(); qGo(1); return; }
    if("1234".includes(e.key)){ const b=document.querySelector('[data-o="'+(+e.key-1)+'"]'); if(b) b.click(); } }
});
render();
